name: Claude Code Review

# Advisory automated review. Never a required check: do not add it to branch
# rules. Agents open PRs ready-for-review and merge their own once the required
# checks are green, so this fires on opened/synchronize as well as
# ready_for_review (the four types track_progress supports).
#
# Needs the Claude GitHub App on this repo and the CLAUDE_CODE_OAUTH_TOKEN repo
# secret. Without the secret the job finishes green with every step skipped.
# Fork PRs and Dependabot/Renovate PRs get no secrets and skip the same way.
# Deliberately `pull_request`, never `pull_request_target`.
on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

permissions:
  contents: read

# Re-review on every push, but only the newest push per PR.
concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  claude-advisory-review:
    name: Claude advisory review
    if: >-
      ${{ !github.event.pull_request.draft
      && github.event.pull_request.head.repo.full_name == github.repository
      && github.actor != 'dependabot[bot]'
      && github.actor != 'renovate[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write # post the review + inline comments
      id-token: write # OIDC exchange for the Claude GitHub App token
      actions: read # read CI results for the PR

    steps:
      # Secrets cannot appear in `if:`, so surface presence as a step output.
      - name: Check for CLAUDE_CODE_OAUTH_TOKEN
        id: gate
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -n "$CLAUDE_CODE_OAUTH_TOKEN" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::CLAUDE_CODE_OAUTH_TOKEN is not set; skipping the Claude review."
          fi

      - name: Checkout repository
        if: steps.gate.outputs.present == 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Claude Code Review
        if: steps.gate.outputs.present == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          allowed_bots: "haynes-dev-bot"
          track_progress: true
          use_sticky_comment: true
          # Pinned full model id, never an alias. `--allowedTools` merges with tag
          # mode's base set; without the Bash and inline-comment grants below
          # Claude cannot run `gh` or post line comments at all.
          claude_args: |
            --model claude-opus-5-5
            --max-turns 60
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr comment:*)"
          additional_permissions: |
            actions: read
          prompt: |
            You are the automated reviewer for hass-immich-addon: a small Python 3.11
            service that pulls photos from an Immich server and publishes them into a
            folder Home Assistant displays on dashboards. It ships as a multi-arch Docker
            image (ghcr.io). The PR branch is already checked out. Review PR
            #${{ github.event.pull_request.number }} of ${{ github.repository }}.

            ## Step 1 - context
            - `gh pr diff ${{ github.event.pull_request.number }}` for the changes
            - `gh pr view ${{ github.event.pull_request.number }}` for intent
            - Read `README.md` (Configuration and Process sections are the behavior
              contract). `documents/design.md` is an early AI-written sketch, not
              authoritative. Do not repeat feedback already present on the PR.

            ## Step 2 - what this repo cares about
            Layout: `src/config/` (schema, YAML/env/CLI loading; precedence yaml < env <
            CLI), `src/immich/` (HTTP client, API wrapper, asset selectors),
            `src/photo_updater.py` (the update cycle), `src/utils/` (file and media
            helpers), `tests/` (pytest, HTTP mocked), `Dockerfile`, `.github/workflows/`.

            **CRITICAL - block the merge**
            - Secrets and PII: the Immich API key or server URL hardcoded, committed, or
              logged (including at DEBUG, or via exception text or request dumps); a
              committed `.env`; real names, places or personal paths in `settings.yaml`,
              tests, docs or fixtures (use obvious placeholders).
            - Display-safety invariant (README "Process"): the cycle must fetch and stage
              the next batch BEFORE touching the photos on display. Old media is deleted
              only after a complete, non-empty batch is staged. Any failure (Immich down,
              validation error, bad archive) or an empty result must leave the previous
              photos in place and log a warning or error. Flag any change that wipes
              `HASS_IMG_PATH` early, publishes a partial or empty batch, or lets an
              exception escape the cycle and kill the run loop.
            - Staging safety: the staging dir stays hidden (name starts with `.`) inside
              `HASS_IMG_PATH`, is removed at the end of every cycle (success or failure)
              and at the start of the next, and publishing keeps using same-filesystem
              renames. Anything that deletes or recurses outside `HASS_IMG_PATH`, follows
              untrusted paths from an archive (zip-slip, absolute or `..` members), or
              builds a shell command from Immich-supplied names or config values.
            - Logic errors: unhandled `None`, wrong exception types swallowed, off-by-one
              in cycling filter sets, race conditions between the loop and signal handler.

            **HIGH - should fix**
            - Date filters: `taken_after` / `taken_before` must always be timezone-
              qualified before being sent to Immich (timezone-less means UTC, an explicit
              offset is kept, YAML date/datetime objects handled). Flag regressions.
            - Config: a new or changed setting not wired through `schema.py`, YAML, env
              and CLI with the documented precedence, or not documented in `README.md`.
            - Behavior or config change with no matching update to `README.md`, or logic
              change with no test change under `tests/`. Tests must mock the HTTP session
              and never reach a real Immich server or real credentials.
            - Network calls without a timeout; unvalidated or unchecked-status responses;
              unchecked dict access on Immich API data.
            - HEIC/video conversion (`pillow-heif`, `ffmpeg`) failures that are swallowed
              silently or leave temp files behind.
            - `Dockerfile` or `requirements*.txt` changes that break the multi-arch
              (amd64 + arm64) build, add unpinned or unneeded runtime dependencies, or
              run as an unnecessarily privileged user; unrelated image-tag changes.
            - Workflow changes: broader `permissions:` than needed, `pull_request_target`,
              secrets exposed to fork PRs, or untrusted PR text interpolated into `run:`.

            **MEDIUM - consider**
            - Log levels that hide failures (errors logged at INFO/DEBUG) or log noise
              that would flood a long-running service.
            - Resource leaks: unclosed files or sessions, temp files not cleaned.
            - Dead code or config left behind by a refactor.

            **Ignore entirely:** formatting, naming, import order, missing docstrings on
            unchanged code, and feature suggestions beyond the PR's intent.

            ## Step 3 - report
            - Post each line-specific finding with
              `mcp__github_inline_comment__create_inline_comment` (`confirmed: true`),
              prefixing the body with its severity: `CRITICAL:`, `HIGH:` or `MEDIUM:`.
              Keep each finding to a few sentences, with the concrete failure and a fix.
            - Then post ONE summary comment with `gh pr comment` containing a verdict
              (`Looks good` / `Needs changes` / `Has critical issues`) and the findings
              grouped by severity, each naming the file and line. No praise.
            - If the diff is clean, say exactly "No findings." followed by one sentence on
              what you checked. Never invent a finding to look thorough.
            - Only review files changed in this PR. Post GitHub comments only - do not
              return the review as chat text.
